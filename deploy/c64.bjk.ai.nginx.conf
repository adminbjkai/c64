# c64.bjk.ai — reverse proxy to the c64 static server (systemd: c64.bjk.ai.service)
# Install: sudo cp deploy/c64.bjk.ai.nginx.conf /etc/nginx/sites-available/c64.bjk.ai
#          sudo ln -s /etc/nginx/sites-available/c64.bjk.ai /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name c64.bjk.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name c64.bjk.ai;

    ssl_certificate /etc/letsencrypt/live/bjk.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bjk.ai/privkey.pem;

    # The app is static and never receives uploads; keep bodies tiny.
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:8166;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
