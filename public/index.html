<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="c64 — a local-first workspace for decoding, formatting, converting and inspecting structured text. JSON, XML, YAML, CSV, Base64, JWT, hashes, diffs, regex and more, in tileable panes. Nothing leaves your browser." />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
  <!-- Local-only guarantee, enforced by the browser: the page may only load
       its own files and can never make a request carrying user content. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>c64 — local encode / decode / format workspace</title>
  <link rel="stylesheet" href="/public/styles.css" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="modulepreload" href="/dist/src/main.js" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Tools">
      <div class="sidebar-brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <strong>c64</strong>
          <span class="tagline">encode · decode · format</span>
        </div>
      </div>
      <label class="search">
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input id="tool-search" type="search" placeholder="Search tools…" autocomplete="off" spellcheck="false" aria-label="Search tools" />
        <kbd>Alt⇧K</kbd>
      </label>
      <nav class="tool-nav" id="tool-nav" aria-label="Tool list"></nav>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button id="sidebar-toggle" class="btn icon" type="button" title="Show / hide the tool list" aria-label="Toggle sidebar" aria-expanded="true"></button>
        <button id="board-menu" class="btn tb board-btn" type="button" title="Boards: switch, create, export, import, share" aria-haspopup="menu"></button>
        <span class="topbar-hint">Tile panes to compare, convert, decode or chain tools. Everything is saved locally.</span>
        <span class="spacer"></span>
        <button id="add-right" class="btn tb" type="button" title="Add a pane to the right of the active one (Alt+Shift+R)"></button>
        <button id="add-below" class="btn tb" type="button" title="Add a pane below the active one (Alt+Shift+B)"></button>
        <span class="divider"></span>
        <button id="palette-toggle" class="btn tb" type="button" title="Command palette (⌘/Ctrl+K)"></button>
        <button id="help-toggle" class="btn tb" type="button" aria-expanded="false" aria-controls="help" title="Keyboard shortcuts (Alt+Shift+/)"></button>
        <button id="theme-toggle" class="btn icon" type="button" title="Toggle dark / light (Alt+Shift+T)" aria-label="Toggle theme"></button>
      </header>

      <main id="board" class="board" aria-label="Workspace board"></main>

      <footer id="statusbar" class="statusbar" aria-label="Status"></footer>
    </div>
  </div>

  <aside id="help" class="help" hidden></aside>

  <script type="module" src="/dist/src/main.js"></script>
</body>
</html>
